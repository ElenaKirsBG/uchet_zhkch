<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

try{var _t=(JSON.parse(localStorage.getItem('ku.settings')||'{}')||{}).theme||'auto';document.documentElement.dataset.theme=_t==='dark'||(_t==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}catch(e){}</script>
<style>
/* Коммуналка · © 2026 Елена Кирсанова. Все права защищены. */
:root{--bg:#f4f2ff;--card:#fff;--card2:#f7f6ff;--ink:#1f1b3d;--mut:#6c6892;--line:rgba(91,76,180,.14);--acc:#7c3aed;--acc2:#db2777;
 --good:#047857;--goodbg:#d1fae5;--bad:#e11d48;--badbg:#ffe4e6;--warn:#a16207;--warnbg:#fef3c7;
 --sh:0 10px 28px rgba(76,52,170,.10),0 1px 3px rgba(76,52,170,.07);--grad:linear-gradient(135deg,#6366f1 0%,#8b5cf6 36%,#d946ef 70%,#f43f5e 100%);
 --r:22px;--pro-acc:#7c3aed;color-scheme:light}
:root[data-theme=dark]{--bg:#0e0c1c;--card:#1b1831;--card2:#24203f;--ink:#f2f0ff;--mut:#a9a5cf;--line:rgba(255,255,255,.10);
 --good:#34d399;--goodbg:rgba(16,185,129,.16);--bad:#fb7185;--badbg:rgba(244,63,94,.17);--warn:#fbbf24;--warnbg:rgba(245,158,11,.16);
 --sh:0 10px 28px rgba(0,0,0,.40);--grad:linear-gradient(135deg,#4f46e5 0%,#7c3aed 38%,#c026d3 72%,#e11d48 100%);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(55% 38% at 0% 0%,rgba(99,102,241,.16),transparent 70%),radial-gradient(50% 34% at 100% 12%,rgba(236,72,153,.13),transparent 70%),radial-gradient(60% 40% at 50% 100%,rgba(56,189,248,.12),transparent 70%)}
body.noscroll{overflow:hidden}
button{font-family:inherit;cursor:pointer}
a{color:var(--acc)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.small{font-size:13px}.hide{display:none!important}

/* ---------- шапка ---------- */
header.hero{background:var(--grad);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 0 62px;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
header.hero.compact{padding-bottom:22px}
header.hero:before,header.hero:after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
header.hero:before{width:240px;height:240px;right:-70px;top:-90px}
header.hero:after{width:150px;height:150px;left:-50px;bottom:-70px;background:rgba(255,255,255,.08)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand .lg{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:20px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25)}
.hchip{border:0;border-radius:999px;padding:7px 12px;background:rgba(255,255,255,.2);color:#fff;font-weight:700;font-size:13px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);white-space:nowrap}
.objsw{margin-top:14px;position:relative;z-index:1;border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:14px;padding:8px 12px;font-weight:700;font-size:15px;display:inline-flex;gap:8px;align-items:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.month{display:flex;align-items:center;gap:6px;margin-top:16px;position:relative;z-index:1;font-weight:700;font-size:17px}
.month button{border:0;background:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;border-radius:11px;font-size:20px;line-height:1}
.month button:disabled{opacity:.35}
.month span{min-width:140px;text-align:center}
.total{font-size:clamp(32px,11vw,42px);font-weight:850;letter-spacing:-.025em;margin-top:6px;position:relative;z-index:1;line-height:1.1}
.hpills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;position:relative;z-index:1}
.hpills span{background:rgba(255,255,255,.18);border-radius:999px;padding:5px 10px;font-size:13px;font-weight:650}
.hpills span.w{background:rgba(255,255,255,.95);color:#be123c}
.htitle{font-size:26px;font-weight:850;letter-spacing:-.02em;margin-top:14px;position:relative;z-index:1}
main.wrap{margin-top:-42px;position:relative;z-index:2}
main.wrap.flat{margin-top:16px}

/* ---------- карточки ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin:0 0 14px}
.card h3{margin:0 0 10px;font-size:17px;letter-spacing:-.01em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:600;color:var(--mut);font-size:13px}
.lnk{border:0;background:none;color:var(--acc);font-weight:700;font-size:14px;padding:0}
.ban{border-radius:18px;padding:12px 14px;margin:0 0 12px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.ban b{display:block}.ban .bi{font-size:22px;line-height:1.1}
.ban.warn{background:linear-gradient(var(--warnbg),var(--warnbg)),var(--card);color:var(--warn);box-shadow:var(--sh)}.ban.bad{background:linear-gradient(var(--badbg),var(--badbg)),var(--card);color:var(--bad);box-shadow:var(--sh)}.ban.good{background:linear-gradient(var(--goodbg),var(--goodbg)),var(--card);color:var(--good);box-shadow:var(--sh)}
.ban.info{background:var(--card);box-shadow:var(--sh)}
.ban .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.ban .acts button{border:0;border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px;background:rgba(127,127,127,.16);color:inherit}

/* плитки категорий */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(min-width:620px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{border:0;text-align:left;color:var(--ink);background:var(--card);background:linear-gradient(150deg,color-mix(in srgb,var(--c1) 22%,var(--card)) 0%,var(--card) 62%);border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:flex;flex-direction:column;gap:2px;min-height:132px;position:relative;overflow:hidden;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .tt{font-weight:700;font-size:14px;margin-top:10px;line-height:1.25}
.tile .tv{font-weight:850;font-size:20px;letter-spacing:-.01em}
.tile .ts{font-size:12px;color:var(--mut);line-height:1.3}
.tile .tplus{position:absolute;right:12px;top:12px;width:26px;height:26px;border-radius:9px;background:color-mix(in srgb,var(--c2) 16%,transparent);color:var(--c2);display:grid;place-items:center;font-weight:800;font-size:18px}
.ic{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:linear-gradient(135deg,var(--c1),var(--c2));display:grid;place-items:center;font-size:21px;box-shadow:0 6px 14px color-mix(in srgb,var(--c2) 38%,transparent)}
.ic.s{width:36px;height:36px;flex-basis:36px;border-radius:12px;font-size:18px}

/* записи */
.rec{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.rec:first-child{border-top:0}
.rec .mid{flex:1;min-width:0}
.rec .mid b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .mid span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .amt{text-align:right}
.rec .amt b{display:block;font-size:16px;white-space:nowrap}
.st{display:inline-block;font-size:11px;font-weight:750;border-radius:999px;padding:2px 8px;margin-top:3px;white-space:nowrap}
.st.ok{background:var(--goodbg);color:var(--good)}.st.no{background:var(--badbg);color:var(--bad)}
.mhead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 8px;font-weight:800;font-size:15px}
.mhead span{color:var(--mut);font-weight:650;font-size:13px}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.empty .e{font-size:44px;margin-bottom:6px}

/* фильтры */
.cchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:none}
.cchips::-webkit-scrollbar{display:none}
.cc{flex:0 0 auto;border:0;border-radius:999px;padding:8px 13px;font-weight:650;font-size:14px;background:var(--card2);color:var(--ink);display:flex;gap:6px;align-items:center;box-shadow:inset 0 0 0 1px var(--line)}
.cc.on{background:linear-gradient(135deg,var(--c1,#8b5cf6),var(--c2,#7c3aed));color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--c2,#7c3aed) 35%,transparent)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:flex;background:var(--card2);border-radius:14px;padding:4px;gap:4px;box-shadow:inset 0 0 0 1px var(--line)}
.seg button{flex:1;border:0;border-radius:10px;padding:8px 6px;background:none;color:var(--mut);font-weight:700;font-size:13.5px}
.seg button.on{background:var(--card);color:var(--acc);box-shadow:0 2px 8px rgba(60,40,140,.12)}

/* формы */
.fld{margin-top:12px;min-width:0}
.fld>label{display:block;font-size:12px;font-weight:750;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.in{width:100%;border:1.5px solid var(--line);background:var(--card2);color:var(--ink);border-radius:14px;padding:11px 12px;font:16px/1.3 inherit;outline:none;-webkit-appearance:none;appearance:none;min-height:46px}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.in:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(124,58,237,.15)}
.in.big{font-size:22px;font-weight:800}
textarea.in{min-height:70px;resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
@media(max-width:420px){.g4{grid-template-columns:1fr 1fr}}
.g4 .fld,.g3 .fld{margin-top:6px}
.g4 .fld>label,.g3 .fld>label{font-size:10.5px}
.box{border-radius:18px;padding:12px;margin-top:12px;background:var(--card2);background:color-mix(in srgb,var(--c1,#8b5cf6) 11%,var(--card));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c2,#7c3aed) 18%,transparent)}
.box .bh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:14px}
.box .bh span{font-weight:700;color:var(--c2,var(--acc));font-size:13px;background:color-mix(in srgb,var(--c2,#7c3aed) 14%,transparent);padding:3px 9px;border-radius:999px;white-space:nowrap}
.trow{background:var(--card);border-radius:14px;padding:10px;margin-top:8px}
.trow .bh{font-size:13.5px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px 16px;font-weight:750;font-size:16px;line-height:1.2;background:var(--grad);color:#fff;text-align:center;text-decoration:none;box-shadow:0 8px 20px rgba(168,85,247,.30);margin-top:10px}
.btn.sec{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.danger{background:var(--badbg);color:var(--bad);box-shadow:none}
.btn:disabled{opacity:.5}
.brow{display:flex;gap:8px}.brow .btn{flex:1}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:650}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.more{border:0;background:none;color:var(--acc);font-weight:700;padding:12px 0 0;font-size:14.5px}
.fcat{display:flex;gap:10px;align-items:center;font-size:17px}
.photo{display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.photo img{width:76px;height:76px;object-fit:cover;border-radius:14px;box-shadow:var(--sh);cursor:zoom-in}
.photo label.pb{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:10px 13px;background:var(--card2);box-shadow:inset 0 0 0 1px var(--line);font-weight:700;font-size:14px;cursor:pointer}

/* нижнее меню */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:6px 8px calc(8px + env(safe-area-inset-bottom));background:var(--card);background:color-mix(in srgb,var(--card) 84%,transparent);-webkit-backdrop-filter:saturate(1.7) blur(18px);backdrop-filter:saturate(1.7) blur(18px);box-shadow:0 -1px 0 var(--line),0 -8px 24px rgba(60,40,140,.06)}
nav.tabs .in2{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
nav.tabs button{border:0;background:none;font-weight:650;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav.tabs button svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--acc)}
nav.tabs .fab{width:60px;height:60px;border-radius:21px;background:var(--grad);color:#fff;font-size:32px;font-weight:300;margin:-28px auto 2px;box-shadow:0 10px 24px rgba(168,85,247,.45),0 0 0 5px var(--bg);display:grid;place-items:center;padding:0}
nav.tabs .fab:active{transform:scale(.94)}

/* шторка */
#sheet{position:fixed;inset:0;z-index:100;display:none}
#sheet.on{display:block}
.sh-bg{position:absolute;inset:0;background:rgba(18,10,48,.46);animation:fade .2s}
.sh{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;max-height:94vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.9,.3,1);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media(min-width:760px){.sh{bottom:auto;top:4vh;border-radius:28px;max-height:92vh;animation:fade .2s}}
.sh-grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 8px}
.shh{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-8px;background:var(--card);padding:6px 0 8px;z-index:3}
.shh h2{margin:0;font-size:21px;letter-spacing:-.01em}
.x{border:0;background:var(--card2);color:var(--ink);width:36px;height:36px;border-radius:12px;font-size:22px;line-height:1;flex:0 0 36px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;margin-top:10px}
.dl dt{color:var(--mut)}.dl dd{margin:0;text-align:right;font-weight:650;word-break:break-word}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.tbl td,.tbl th{padding:7px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl th{color:var(--mut);font-weight:700;font-size:12px;border-top:0}
.tbl td:first-child,.tbl th:first-child{text-align:left;white-space:normal}

/* настройки */
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;width:100%;border-left:0;border-right:0;border-bottom:0;background:none;color:var(--ink);text-align:left;font-size:15.5px}
.row:first-of-type{border-top:0}
.row .rt{flex:1;min-width:0}.row .rt span{display:block;font-size:12.5px;color:var(--mut)}
.row .chev{color:var(--mut);font-size:20px}
.row .ri{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;font-size:17px;background:var(--card2)}
.lock{font-size:11px;font-weight:800;color:#fff;background:var(--grad);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:2px}
.catl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.catl:first-child{border-top:0}
.catl .nm{flex:1;min-width:0;font-weight:650}
.catl .nm span{display:block;font-size:12px;color:var(--mut);font-weight:500}
.mini{border:0;background:var(--card2);color:var(--ink);border-radius:10px;width:34px;height:34px;font-size:15px;flex:0 0 34px}
.sw{position:relative;width:48px;height:28px;flex:0 0 48px}
.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.sw i:after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:.2s}
.sw input:checked+i{background:linear-gradient(135deg,#8b5cf6,#d946ef)}
.sw input:checked+i:after{transform:translateX(20px)}
.emo{display:flex;gap:6px;flex-wrap:wrap}
.emo button{border:0;width:44px;height:44px;border-radius:13px;background:var(--card2);font-size:22px;box-shadow:inset 0 0 0 1px var(--line)}
.emo button.on{box-shadow:inset 0 0 0 2px var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--card))}

/* аналитика */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{border-radius:20px;padding:13px 14px;color:#fff;box-shadow:var(--sh)}
.kpi span{display:block;font-size:12.5px;opacity:.9;font-weight:650}
.kpi b{display:block;font-size:clamp(16px,5.2vw,21px);font-weight:850;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chart{width:100%;height:auto;display:block}
.chart text{font:10px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:var(--mut)}
.chart .grid{stroke:var(--line);stroke-width:1}
.leg{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.leg div{display:flex;align-items:center;gap:9px;font-size:14px}
.leg i{width:12px;height:12px;border-radius:4px;flex:0 0 12px}
.leg span{flex:1}.leg b{white-space:nowrap}.leg em{font-style:normal;color:var(--mut);font-size:12.5px;width:40px;text-align:right}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{width:150px;height:150px;flex:0 0 150px;margin:0 auto}
.donut .leg{flex:1;min-width:190px;margin:0}
.locked{position:relative;min-height:340px}
.locked .blur{filter:blur(7px);opacity:.55;pointer-events:none;user-select:none}
.locked .lc{position:absolute;left:0;right:0;top:30px;margin:0 auto;max-width:360px;text-align:center}
.up{color:var(--bad)}.down{color:var(--good)}

#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#1f1b3d;color:#fff;padding:11px 16px;border-radius:14px;font-weight:650;font-size:14.5px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.on{opacity:1;transform:translateX(-50%)}
.foot{text-align:center;color:var(--mut);font-size:12.5px;margin:18px 0 6px}
#proBox{background:var(--card)!important;color:var(--ink)!important}
#proBox .pro-b{background:var(--grad)}#proBox .pro-b.sec{background:rgba(127,127,127,.15)}
.pro-card .pro-b{background:var(--grad)}.pro-card .pro-b.sec{background:rgba(127,127,127,.15);color:inherit}
.pro-card{background:linear-gradient(140deg,color-mix(in srgb,#8b5cf6 14%,var(--card)),var(--card) 70%)}
</style>

const DB=(()=>{let p=null;
 function open(){return p||(p=new Promise((ok,no)=>{let r;try{r=indexedDB.open('kommunal_db',1)}catch(e){no(e);return}
  r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos');if(!d.objectStoreNames.contains('snaps'))d.createObjectStore('snaps')};
  r.onsuccess=()=>ok(r.result);r.onerror=()=>{p=null;no(r.error)}}))}
 function tx(store,mode,fn){return open().then(d=>new Promise((ok,no)=>{const t=d.transaction(store,mode),q=fn(t.objectStore(store));let res;if(q)q.onsuccess=()=>{res=q.result};t.oncomplete=()=>ok(res);t.onerror=()=>no(t.error);t.onabort=()=>no(t.error)}))}
 return{get:(s,k)=>tx(s,'readonly',st=>st.get(k)),put:(s,k,v)=>tx(s,'readwrite',st=>st.put(v,k)),del:(s,k)=>tx(s,'readwrite',st=>st.delete(k)),keys:s=>tx(s,'readonly',st=>st.getAllKeys())}})();

function load(){
 const rr=LS.get(K_REC),rt=LS.get(K_TAR),rs=LS.get(K_SET);
 if(rr!=null){try{const v=JSON.parse(rr);if(v===null)records=[];else if(Array.isArray(v))records=v;else throw new Error('неожиданный формат')}
  catch(e){locked=true;lockMsg='Не удалось прочитать сохранённые записи ('+e.message+'). Приложение ничего не изменило и ничего не будет записывать, пока это не исправлено.'}}
 if(rt!=null){try{const v=JSON.parse(rt);if(Array.isArray(v))rules=v;else if(v!==null)throw new Error('неожиданный формат')}
  catch(e){locked=true;lockMsg='Не удалось прочитать тарифы ('+e.message+'). Приложение ничего не изменило и ничего не будет записывать, пока это не исправлено.'}}
 const hadLegacy=rr!=null||rt!=null;
 if(rt==null&&records.length){rules=[J(LEGACY_RULE)];rulesVirtual=true} // как в первой версии: тариф по умолчанию, пока не сохранён свой
 if(rs){try{S=JSON.parse(rs)}catch(e){S=null}}
 if(!S||!Array.isArray(S.objects)||!S.objects.length){
  if(hadLegacy){S=legacySettings();saveSettings()}
  else{S=defaultSettings('ru');firstRun=true}
 }
 fixSettings();
 if(hadLegacy&&!LS.get('ku.snap1')&&!locked){snapshot('Перед обновлением до версии 2').then(()=>{try{LS.set('ku.snap1','1')}catch(e){}})}
 if(locked)snapshot('Нечитаемые данные '+todayISO());
}

 cats:['electricity','water','property_tax','garbage_tax'],names:{water:'Водоснабжение',property_tax:'Налог на недвижимость',garbage_tax:'Такса смет'},remind:{}}]}}

function fixSettings(){
 S.customCats=Array.isArray(S.customCats)?S.customCats:[];S.theme=S.theme||'auto';
 S.objects.forEach(o=>{o.id=o.id||('o'+Date.now());o.name=o.name||'Мой дом';o.emoji=o.emoji||'🏠';o.cats=Array.isArray(o.cats)?o.cats:[];o.names=o.names||{};
  o.vat=o.vat||{on:false,rate:20};o.elec=[1,2,3].includes(+o.elec)?+o.elec:1;o.remind=o.remind||{};o.currency=o.currency||'EUR'});

 records.forEach(r=>{if(!r||typeof r!=='object'||!r.category)return;const o=S.objects.find(x=>x.id===objId(r));if(o&&!o.cats.includes(r.category))o.cats.push(r.category)});

const OBJ=()=>S.objects.find(o=>o.id===S.active)||firstObj();
const valid=r=>r&&typeof r==='object'&&r.category;
const recsOf=oid=>records.filter(r=>valid(r)&&objId(r)===oid);

function cat(id,o){o=o||OBJ();const c=CATS[id]||S.customCats.find(x=>x.id===id);const b=c||{title:id,emoji:'🧾',type:'fixed',unit:'',g:['#cbd5e1','#64748b']};
 return Object.assign({},b,{id,title:(o.names&&o.names[id])||b.title})}
const cv=c=>`--c1:${c.g[0]};--c2:${c.g[1]}`;
const mtr=r=>r.category==='water'?(r.water||r.meter):(r.meter||r.water);
function usageOf(r){const t=cat(r.category,S.objects.find(o=>o.id===objId(r))).type;
 if(t==='elec'&&r.electricity){const e=r.electricity;return usage(e.t1_old,e.t1_new)+usage(e.t2_old,e.t2_new)+usage(e.t3_old,e.t3_new)}
 if(t==='meter'){const m=mtr(r);return m?usage(m.old_reading,m.new_reading):0}return null}
function fmt(n,cur){cur=cur||OBJ().currency;n=+n||0;try{return new Intl.NumberFormat('ru-RU',{style:'currency',currency:cur,minimumFractionDigits:Math.abs(n%1)>0.0001?2:0,maximumFractionDigits:2}).format(n)}catch(e){return fnum(n)+' '+cur}}
const fshort=n=>n>=1e6?fnum(n/1e6,1)+' млн':n>=1e4?fnum(n/1e3,0)+' тыс':n>=1e3?fnum(n/1e3,1)+' тыс':fnum(n,0);
function lastOf(oid,cid,exclude){return records.filter(r=>valid(r)&&r.category===cid&&objId(r)===oid&&r.id!==exclude).sort(byDate)[0]||null}
function rulesFor(oid){return rules.filter(r=>r&&(r.objectId&&S.objects.some(o=>o.id===r.objectId)?r.objectId:firstObj().id)===oid).sort((a,b)=>String(b.effectiveMonth).localeCompare(String(a.effectiveMonth)))}
function ruleAt(oid,date){const m=String(date||todayISO()).slice(0,7),rs=rulesFor(oid);return rs.find(r=>r.effectiveMonth<=m)||rs[rs.length-1]||null}
function rateOf(rule,cid,t){if(!rule)return null;let v;
 if(cid==='electricity')v=rule.electricity&&rule.electricity['t'+t+'_rate'];
 else if(cid==='water'&&rule.waterRate!=null)v=rule.waterRate;
 else v=rule.rates&&rule.rates[cid];
 return v==null||v===''?null:num(v)}

 const recent=rs.slice().sort(byDate).slice(0,6);

function lastReading(r){const c=cat(r.category);if(c.type==='elec'&&r.electricity){const e=r.electricity,n=Math.max(OBJ().elec,num(e.t3_new)?3:num(e.t2_new)?2:1);return[1,2,3].slice(0,n).map(i=>fnum(e['t'+i+'_new'])).join(' / ')}

 const bits=[fdate(r.date)];if(u)bits.push(fnum(u)+' '+c.unit);if(c.type==='fixed'&&r.taxPeriod)bits.push(r.taxPeriod);if(r.photo||r.photoId)bits.push('📎');

 if(A.range==='12m')return Array.from({length:12},(_,i)=>mAdd(now,i-11));

 const ms=recs().map(r=>String(r.date||'').slice(0,7)).filter(m=>/^\d{4}-\d{2}$/.test(m)).sort();if(!ms.length)return[now];

function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}

 const bw=iw/months.length,step=Math.ceil(months.length/12);let g='<defs>'+keys.map((k,i)=>`<linearGradient id="bg${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${colors[i][0]}"/><stop offset="1" stop-color="${colors[i][1]}"/></linearGradient>`).join('')+'</defs>';

 months.forEach((m,i)=>{const x=pl+i*bw+bw*.17,w=Math.max(2,bw*.66);let y0=pt+ih;
  keys.forEach((k,ki)=>{const v=get(m,k)||0;if(v<=0)return;const hh=ih*v/mx;y0-=hh;g+=`<rect x="${x.toFixed(1)}" y="${y0.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(hh-1,.5).toFixed(1)}" rx="3" fill="url(#bg${ki})"><title>${mTitle(m)}: ${unitFmt(v)}</title></rect>`});
  if(i%step===0)g+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${Hh-6}" text-anchor="middle">${mShort(m)}${months.length>12&&m.endsWith('-01')?' '+m.slice(2,4):''}</text>`});
 return`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img">${g}</svg>`}
function svgDonut(parts,center){const R=58,C=2*Math.PI*R,tot=parts.reduce((s,p)=>s+p.v,0)||1;let off=0,g='<defs>'+parts.map((p,i)=>`<linearGradient id="dg${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${p.c[0]}"/><stop offset="1" stop-color="${p.c[1]}"/></linearGradient>`).join('')+'</defs>';
 parts.forEach((p,i)=>{const len=C*p.v/tot;g+=`<circle cx="75" cy="75" r="${R}" fill="none" stroke="url(#dg${i})" stroke-width="22" stroke-dasharray="${Math.max(len-1.5,0.5).toFixed(2)} ${(C-Math.max(len-1.5,0.5)).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 75 75)"/>`;off+=len});
 return`<svg viewBox="0 0 150 150">${g}<text x="75" y="72" text-anchor="middle" style="font:800 15px -apple-system,sans-serif;fill:var(--ink)">${esc(center[0])}</text><text x="75" y="90" text-anchor="middle" style="font:11px -apple-system,sans-serif;fill:var(--mut)">${esc(center[1])}</text></svg>`}

function statBody(){const o=OBJ(),months=rangeMonths(),set=new Set(months),rs=recs().filter(r=>set.has(String(r.date||'').slice(0,7)));

 const keys=o.cats.filter(id=>rs.some(r=>r.category===id)).concat([...new Set(rs.map(r=>r.category))].filter(id=>!o.cats.includes(id)));
 const tot=sum(rs),now=mkey(new Date()),active=months.filter(m=>m<=now),mt=months.map(m=>keys.reduce((s,k)=>s+(by[m][k]||0),0));
 const mx=Math.max(...mt,0),mxM=months[mt.indexOf(mx)],un=sum(rs.filter(r=>!r.paymentDate)),avg=tot/Math.max(1,active.filter(m=>by[m]&&Object.keys(by[m]).length).length||1);
 const K=(l,v,g)=>`<div class="kpi" style="background:${g}"><span>${l}</span><b class="num">${v}</b></div>`;

 h+=`<div class="card"><h3>Расходы по месяцам</h3>${svgBars(months,(m,k)=>by[m][k],keys,keys.map(k=>cat(k).g),v=>fshort(v))}</div>`;
 const parts=keys.map(k=>({k,v:rs.filter(r=>r.category===k).reduce((s,r)=>s+amt(r),0),c:cat(k).g})).filter(p=>p.v>0).sort((a,b)=>b.v-a.v);

 const meters=keys.filter(k=>cat(k).type!=='fixed');
 if(meters.length){if(!meters.includes(A.cons))A.cons=meters[0];const c=cat(A.cons),u={};months.forEach(m=>u[m]=0);rs.filter(r=>r.category===A.cons).forEach(r=>{u[String(r.date).slice(0,7)]+=usageOf(r)||0});
  const tu=Object.values(u).reduce((a,b)=>a+b,0),cm=months.filter(m=>u[m]>0).length;
  h+=`<div class="card"><h3>Потребление <small>${cm?'в среднем '+fnum(tu/cm,1)+' '+c.unit+' в месяц':''}</small></h3><div class="cchips">${meters.map(k=>{const x=cat(k);return`<button class="cc ${A.cons===k?'on':''}" style="${cv(x)}" data-a="a-cons" data-cat="${k}">${x.emoji} ${esc(x.title)}</button>`}).join('')}</div>

 const y=new Date().getFullYear(),cmN=new Date().getMonth()+1,yy=recs();
 const both=[];for(let i=1;i<=cmN;i++){const a=(y-1)+'-'+pad(i),c=y+'-'+pad(i);if(yy.some(r=>String(r.date).startsWith(a))&&yy.some(r=>String(r.date).startsWith(c)))both.push(i)}
 const yr=(Y,k)=>yy.filter(r=>r.category===k&&String(r.date).startsWith(Y+'-')&&both.includes(+String(r.date).slice(5,7))).reduce((s,r)=>s+amt(r),0);
 const ks=o.cats.filter(k=>yr(y,k)||yr(y-1,k));
 if(ks.length&&both.length){let t1=0,t0=0;
  h+=`<div class="card"><h3>${y} и ${y-1} <small>${both.length===cmN?'январь — '+MON[cmN-1].toLowerCase():'одни и те же месяцы: '+both.map(i=>MONS[i-1]).join(', ')}</small></h3><table class="tbl"><tr><th>Категория</th><th>${y-1}</th><th>${y}</th><th>±</th></tr>`+

const blobToURL=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(r.error);r.readAsDataURL(b)});
function urlToBlob(u){const m=/^data:([^;,]*)(;base64)?,(.*)$/.exec(u);if(!m)return null;const s=m[2]?atob(m[3]):decodeURIComponent(m[3]);const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new Blob([a],{type:m[1]||'image/jpeg'})}
async function saveFile(blob,name){let f=null;try{f=new File([blob],name,{type:blob.type})}catch(e){}

 catch(e){const csv='﻿'+rows.map(l=>l.map(v=>{v=String(v??'');return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(';')).join('\r\n');

  compress(f).then(b=>{F._photoBlob=b;F._photoDel=false;F._photoUrl=URL.createObjectURL(b);drawPhoto()}).catch(x=>alert('Фото не добавлено: '+x.message));return}
 if(a==='o-cat'&&E){const id=el.value;if(el.checked){if(!E.cats.includes(id))E.cats.push(id)}else{if(recsOf(E.id).some(r=>r.category===id)&&!confirm('По этой категории есть записи. Скрыть её? Записи сохранятся и вернутся, если включить категорию снова.')){el.checked=true;return}E.cats=E.cats.filter(x=>x!==id)}drawObj();return}
 if(el.dataset.e==='currency'&&E){E.currency=el.value;return}
 if(el.dataset.e==='vatOn'&&E){E.vat.on=el.checked;drawObj();return}
 if(el.id==='hMonth'){H.month=el.value;$('hlist').innerHTML=histList();return}
 if(el.id==='hStatus'){H.status=el.value;$('hlist').innerHTML=histList();return}
 if(el.id==='obCur'){OB.cur=el.value;return}
 if(el.id==='fileImport'){const f=el.files&&el.files[0];if(f)importFile(f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('sheet').classList.contains('on')&&!sheetLock)closeSheet()});

/* ---------- запуск ---------- */
load();applyTheme();
PRO.init().catch(()=>{}).then(()=>{render();if(firstRun)onboarding();
 if(location.hash==='#add'){history.replaceState(null,'',location.pathname);openForm({})}});
/* старый адрес: подсказка о переезде — только когда новый адрес уже открывается */
if(OLDHOST&&navigator.onLine)fetch(NEWURL+'manifest.webmanifest',{mode:'no-cors',cache:'no-store'}).then(()=>{newLive=true;if(tab==='home')render()}).catch(()=>{});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
